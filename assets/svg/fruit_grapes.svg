<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="grape_sphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ea80fc"/>
      <stop offset="50%" stop-color="#aa00ff"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </radialGradient>
  </defs>

  <!-- Stem & Vine -->
  <path d="M 32,8 C 30,14 32,18 32,22" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32,12 C 40,8 48,10 50,6 C 48,14 42,16 32,14 Z" fill="#00e676" stroke="#ffffff" stroke-width="1"/>

  <!-- Grape Cluster (Spheres) -->
  <!-- Top Row -->
  <circle cx="24" cy="24" r="8" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="40" cy="24" r="8" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Mid-Top Row -->
  <circle cx="17" cy="34" r="8" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="8.5" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="47" cy="34" r="8" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Mid-Bottom Row -->
  <circle cx="24" cy="44" r="8" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="40" cy="44" r="8" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Bottom Single -->
  <circle cx="32" cy="53" r="7.5" fill="url(#grape_sphere)" stroke="#ffffff" stroke-width="1.5"/>
