<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="p2_shell" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b23c00"/>
      <stop offset="60%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="p2_visor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Base Cyber Hull (pointing right) -->
  <path d="M 6,10 L 36,8 L 58,26 L 62,32 L 58,38 L 36,56 L 6,54 L 14,32 Z" 
        fill="url(#p2_shell)" stroke="#ff9100" stroke-width="3" stroke-linejoin="round"/>

  <!-- Energy Trench Lines -->
  <path d="M 10,20 L 32,18 L 48,32 L 32,46 L 10,44" 
        fill="none" stroke="#ffd180" stroke-width="2" stroke-linecap="round"/>

  <!-- Forward Looking Visor / Cockpit (Facing Right) -->
  <path d="M 38,23 L 54,32 L 38,41 L 32,32 Z" 
        fill="url(#p2_visor)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Twin Cyber Optics (Eyes) -->
  <circle cx="42" cy="18" r="4.5" fill="#ffffff" stroke="#ff6d00" stroke-width="1.5"/>
  <circle cx="44" cy="18" r="2" fill="#ff6d00"/>

  <circle cx="42" cy="46" r="4.5" fill="#ffffff" stroke="#ff6d00" stroke-width="1.5"/>
  <circle cx="44" cy="46" r="2" fill="#ff6d00"/>

  <!-- Thruster Nodes at Back -->
  <rect x="4" y="16" width="4" height="8" rx="1.5" fill="#ffffff"/>
  <rect x="4" y="40" width="4" height="8" rx="1.5" fill="#ffffff"/>
</svg>
