  <circle cx="54" cy="50" r="2" fill="#5d4037"/>

  <!-- Inner Ridge Line -->
  <path d="M 16,18 C 22,34 36,46 50,48" fill="none" stroke="#fff9c4" stroke-width="2" stroke-linecap="round"/>
</svg>
