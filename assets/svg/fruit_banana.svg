<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="banana_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ffab00"/>
    </linearGradient>
  </defs>

  <!-- Banana Crescent Body -->
  <path d="M 12,14 C 18,36 36,54 54,50 C 44,48 28,34 22,18 Z" 
        fill="url(#banana_grad)" stroke="#ffffff" stroke-width="2"/>

  <!-- Stem and Tip -->
