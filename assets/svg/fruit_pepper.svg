<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fiery Pepper Gradient -->
    <linearGradient id="pepper_body" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="25%" stop-color="#ff1744"/>
      <stop offset="75%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#8a0000"/>
    </linearGradient>

    <!-- Calyx/Stem Gradient -->
    <linearGradient id="pepper_stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>

    <!-- Inner Fiery Core -->
    <radialGradient id="heat_glow" cx="42%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#ffff00" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff6d00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Heat Aura / Outer Fiery Glow -->
  <path d="M 40,16 C 52,24 50,42 36,53 C 28,60 17,61 13,58 C 11,55 17,47 23,39 C 31,28 35,21 40,16 Z" 
        fill="#ff6d00" opacity="0.3"/>

  <!-- Pepper Body (Curved, Spicy Chili) -->
  <path d="M 40,18 C 49,25 47,41 35,50 C 27,56 18,58 14,56 C 12,54 17,47 22,39 C 29,29 33,21 40,18 Z" 
        fill="url(#pepper_body)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Internal Spicy Heat Glow -->
  <path d="M 38,22 C 45,28 43,39 34,46 C 27,51 21,52 17,51 C 18,47 22,41 27,34 C 32,26 35,22 38,22 Z" 
        fill="url(#heat_glow)"/>

  <!-- Specular Sheen (Curved Highlight) -->
  <path d="M 37,20 C 44,27 42,38 33,45 C 31,44 38,34 33,26 C 32,24 35,21 37,20 Z" 
        fill="#ffffff" opacity="0.65"/>

  <!-- Calyx (Green Crown Leaves at the top) -->
  <path d="M 34,19 C 33,16 31,15 28,17 C 32,19 35,21 37,24 C 38,20 42,18 45,19 C 43,17 40,17 38,18 C 39,15 42,12 44,11 C 39,13 36,16 34,19 Z" 
        fill="url(#pepper_stem)" stroke="#ffffff" stroke-width="1"/>

  <!-- Curved Stem -->
  <path d="M 39,17 C 41,12 45,8 51,7 C 49,9 47,12 42,15" 
        fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
</svg>
